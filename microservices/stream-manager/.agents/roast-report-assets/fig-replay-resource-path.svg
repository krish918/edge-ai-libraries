<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d">
  <title id="t">Replay extraction resource path</title><desc id="d">A replay request reads the complete recording into a temporary seekable file, invokes FFmpeg with software libx264 for clips, reads the complete output into memory, and then stores it. Source limit checking applies to live recording state only.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#569cd6"/></marker></defs>
  <rect width="900" height="390" rx="14" fill="#1a1d24"/>
  <text x="28" y="38" fill="#e6e6e6" font-family="Segoe UI,sans-serif" font-size="21" font-weight="700">One clip request, several full-size copies</text>
  <g font-family="Segoe UI,sans-serif" text-anchor="middle">
    <rect x="28" y="116" width="145" height="100" rx="8" fill="#20242c" stroke="#569cd6" stroke-width="2"/><text x="100" y="151" fill="#e6e6e6" font-size="16">Source video</text><text x="100" y="179" fill="#9aa0aa" font-size="13">filesystem or S3</text>
    <rect x="205" y="116" width="155" height="100" rx="8" fill="#3a2927" stroke="#f48771" stroke-width="2"/><text x="282" y="151" fill="#e6e6e6" font-size="16">Temp file</text><text x="282" y="179" fill="#f48771" font-size="13">whole source staged</text>
    <rect x="392" y="116" width="155" height="100" rx="8" fill="#3a2927" stroke="#f48771" stroke-width="2"/><text x="469" y="151" fill="#e6e6e6" font-size="16">FFmpeg</text><text x="469" y="179" fill="#f48771" font-size="13">software libx264</text>
    <rect x="579" y="116" width="145" height="100" rx="8" fill="#3a2927" stroke="#f48771" stroke-width="2"/><text x="651" y="151" fill="#e6e6e6" font-size="16">RAM []byte</text><text x="651" y="179" fill="#f48771" font-size="13">whole output read</text>
    <rect x="756" y="116" width="116" height="100" rx="8" fill="#20242c" stroke="#4ec9b0" stroke-width="2"/><text x="814" y="151" fill="#e6e6e6" font-size="16">Storage</text><text x="814" y="179" fill="#9aa0aa" font-size="13">publish result</text>
  </g>
  <g fill="none" stroke="#569cd6" stroke-width="2.5" marker-end="url(#a)"><path d="M173 166H205"/><path d="M360 166H392"/><path d="M547 166H579"/><path d="M724 166H756"/></g>
  <rect x="29" y="258" width="843" height="78" rx="7" fill="#2a2422" stroke="#f48771"/>
  <text x="49" y="288" fill="#f48771" font-family="Segoe UI,sans-serif" font-size="15" font-weight="700">Guard gap</text>
  <text x="49" y="315" fill="#e6e6e6" font-family="Segoe UI,sans-serif" font-size="14">The configured size check is only applied when the recording is live; archived inputs can bypass it.</text>
  <text x="29" y="365" fill="#dcdcaa" font-family="Segoe UI,sans-serif" font-size="13">Fix: bound input, duration, output, temp disk, and concurrency for every origin; stream results where possible.</text>
</svg>