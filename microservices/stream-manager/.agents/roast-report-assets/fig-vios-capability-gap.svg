<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">VIOS capability coverage gap</title><desc id="d">Stream Manager covers manual RTSP attach, recording, and frame or clip retrieval. VIOS adds sensor management, WebRTC, RTSP proxy, storage lifecycle, operator UI and integrations, and a scale and observability plane.</desc>
  <rect width="900" height="470" rx="14" fill="#1a1d24"/>
  <text x="28" y="38" fill="#e6e6e6" font-family="Segoe UI,sans-serif" font-size="21" font-weight="700">Capability gap: a service core versus a platform</text>
  <text x="30" y="73" fill="#9aa0aa" font-family="Segoe UI,sans-serif" font-size="14">Based on documented VIOS surfaces; check marks mean implemented at least in part.</text>
  <text x="360" y="111" text-anchor="middle" fill="#9aa0aa" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700">STREAM MANAGER</text>
  <text x="700" y="111" text-anchor="middle" fill="#9aa0aa" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700">VIOS DOCUMENTS</text>
  <g font-family="Segoe UI,sans-serif" font-size="15" fill="#e6e6e6">
    <rect x="24" y="126" width="852" height="42" rx="5" fill="#20242c"/><text x="42" y="153">RTSP ingest + rolling buffer</text><text x="360" y="153" text-anchor="middle" fill="#4ec9b0">Yes</text><text x="700" y="153" text-anchor="middle" fill="#4ec9b0">Yes</text>
    <rect x="24" y="173" width="852" height="42" rx="5" fill="#191d23"/><text x="42" y="200">Selected recording + timestamp replay</text><text x="360" y="200" text-anchor="middle" fill="#4ec9b0">Yes</text><text x="700" y="200" text-anchor="middle" fill="#4ec9b0">Yes</text>
    <rect x="24" y="220" width="852" height="42" rx="5" fill="#20242c"/><text x="42" y="247">ONVIF sensor inventory and control</text><text x="360" y="247" text-anchor="middle" fill="#f48771">No</text><text x="700" y="247" text-anchor="middle" fill="#4ec9b0">Yes</text>
    <rect x="24" y="267" width="852" height="42" rx="5" fill="#191d23"/><text x="42" y="294">WebRTC live/replay and trick modes</text><text x="360" y="294" text-anchor="middle" fill="#f48771">No</text><text x="700" y="294" text-anchor="middle" fill="#4ec9b0">Yes</text>
    <rect x="24" y="314" width="852" height="42" rx="5" fill="#20242c"/><text x="42" y="341">RTSP proxy, upload, storage aging</text><text x="360" y="341" text-anchor="middle" fill="#f48771">No / partial</text><text x="700" y="341" text-anchor="middle" fill="#4ec9b0">Yes</text>
    <rect x="24" y="361" width="852" height="42" rx="5" fill="#191d23"/><text x="42" y="388">UI, events, metrics, routed replicas</text><text x="360" y="388" text-anchor="middle" fill="#f48771">No</text><text x="700" y="388" text-anchor="middle" fill="#4ec9b0">Yes</text>
  </g>
  <text x="28" y="443" fill="#dcdcaa" font-family="Segoe UI,sans-serif" font-size="13">Parity requires product-surface decisions, not just adding a few endpoints.</text>
</svg>