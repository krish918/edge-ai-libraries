<title id="title">Shared buffer: 2-second MPEG-TS slices</title>
<desc id="desc">An attached RTSP stream is read once and copied without re-encoding into about 2-second MPEG-TS slices in tmpfs. Every slice is cut exactly at a keyframe. Readers reserve slices; the oldest slice is retired once no reader holds it.</desc>
