<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-labelledby="title desc">
  <title id="title">Stream Manager high-level architecture</title>
  <desc id="desc">HTTP clients call Gin API handlers. Stream handlers connect to RTSP sources and fill a rolling tmpfs buffer. Record handlers lease that buffer and write recordings and sidecars to a media store with metadata in SQLite. Replay handlers read metadata and sidecars, use FFmpeg to extract frames or clips, and publish derived media.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#315f78"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#176b56"/></marker>
    <style>.box{stroke-width:2;rx:10}.label{font:700 19px Arial,sans-serif;fill:#202b32}.sub{font:15px Arial,sans-serif;fill:#43535a}.edge{fill:none;stroke:#315f78;stroke-width:2.5;marker-end:url(#arrow)}.data{fill:none;stroke:#176b56;stroke-width:2.5;marker-end:url(#arrow-green)}.edge-label{font:14px Arial,sans-serif;fill:#34464e}.section{font:700 14px Arial,sans-serif;fill:#53636a;letter-spacing:1px}</style>
  </defs>
  <rect width="1240" height="800" fill="#f5f6f3"/>
  <text x="42" y="42" class="section">REQUESTS AND CONTROL</text><text x="42" y="420" class="section">VIDEO, INDEX, AND STORAGE</text>
  <rect class="box" x="40" y="82" width="205" height="100" fill="#fff" stroke="#315f78"/><text x="142" y="122" text-anchor="middle" class="label">HTTP clients</text><text x="142" y="150" text-anchor="middle" class="sub">JSON or media requests</text>
  <rect class="box" x="320" y="82" width="250" height="100" fill="#e8f0f4" stroke="#315f78"/><text x="445" y="122" text-anchor="middle" class="label">Gin router + handlers</text><text x="445" y="150" text-anchor="middle" class="sub">validate, route, respond</text>
  <rect class="box" x="675" y="62" width="235" height="105" fill="#e4f1eb" stroke="#176b56"/><text x="792" y="102" text-anchor="middle" class="label">Stream service</text><text x="792" y="130" text-anchor="middle" class="sub">RTSP attach + buffer lifecycle</text>
  <rect class="box" x="675" y="198" width="235" height="105" fill="#e4f1eb" stroke="#176b56"/><text x="792" y="238" text-anchor="middle" class="label">Record service</text><text x="792" y="266" text-anchor="middle" class="sub">worker + recording state</text>
  <rect class="box" x="995" y="62" width="205" height="105" fill="#fff" stroke="#315f78"/><text x="1097" y="102" text-anchor="middle" class="label">RTSP camera</text><text x="1097" y="130" text-anchor="middle" class="sub">H.264 / H.265 over TCP</text>
  <rect class="box" x="995" y="198" width="205" height="105" fill="#f6eedf" stroke="#8a5b16"/><text x="1097" y="238" text-anchor="middle" class="label">FFmpeg + FFprobe</text><text x="1097" y="266" text-anchor="middle" class="sub">segment, remux, extract, check</text>
  <rect class="box" x="675" y="465" width="235" height="110" fill="#e4f1eb" stroke="#176b56"/><text x="792" y="507" text-anchor="middle" class="label">Rolling buffer</text><text x="792" y="536" text-anchor="middle" class="sub">private tmpfs; leased slices</text>
  <rect class="box" x="995" y="465" width="205" height="110" fill="#fff" stroke="#315f78"/><text x="1097" y="507" text-anchor="middle" class="label">MediaStore</text><text x="1097" y="536" text-anchor="middle" class="sub">filesystem or S3</text>
  <rect class="box" x="995" y="620" width="205" height="110" fill="#e8f0f4" stroke="#315f78"/><text x="1097" y="662" text-anchor="middle" class="label">SQLite metadata</text><text x="1097" y="690" text-anchor="middle" class="sub">record state and paths</text>
  <rect class="box" x="320" y="465" width="250" height="110" fill="#e8f0f4" stroke="#315f78"/><text x="445" y="507" text-anchor="middle" class="label">Replay service</text><text x="445" y="536" text-anchor="middle" class="sub">resolve times + cache outputs</text>
  <rect class="box" x="40" y="465" width="205" height="110" fill="#f6eedf" stroke="#8a5b16"/><text x="142" y="507" text-anchor="middle" class="label">Resolver + extractor</text><text x="142" y="536" text-anchor="middle" class="sub">sidecar + FFmpeg</text>
  <rect class="box" x="320" y="620" width="250" height="110" fill="#fff" stroke="#315f78"/><text x="445" y="662" text-anchor="middle" class="label">Media URL access</text><text x="445" y="690" text-anchor="middle" class="sub">signed token or S3 URL</text>
  <path class="edge" d="M245 132 H320"/><text class="edge-label" x="265" y="119">HTTP</text>
  <path class="edge" d="M570 110 H675"/><text class="edge-label" x="590" y="96">stream routes</text>
  <path class="edge" d="M570 145 C620 155 620 226 675 236"/><text class="edge-label" x="582" y="194">record routes</text>
  <path class="edge" d="M570 164 C620 300 580 500 570 505"/><text class="edge-label" x="584" y="354">replay routes</text>
  <path class="edge" d="M910 110 H995"/><text class="edge-label" x="924" y="97">RTSP / RTP</text>
  <path class="data" d="M792 167 V465"/><text class="edge-label" x="804" y="390">closed slices</text>
  <path class="data" d="M910 248 H995"/><text class="edge-label" x="922" y="233">remux / probe</text>
  <path class="data" d="M910 272 C950 320 960 445 1000 470"/><text class="edge-label" x="930" y="378">recording + sidecar</text>
  <path class="data" d="M792 465 V303"/><text class="edge-label" x="804" y="390">leased slices</text>
  <path class="edge" d="M995 675 H910 C850 675 850 610 820 575"/><text class="edge-label" x="876" y="652">metadata</text>
  <path class="edge" d="M995 640 C820 600 700 550 570 530"/><text class="edge-label" x="734" y="580">read metadata</text>
  <path class="data" d="M995 490 C850 430 740 430 570 490"/><text class="edge-label" x="752" y="426">source / sidecar</text>
  <path class="data" d="M570 550 C725 615 850 580 995 550"/><text class="edge-label" x="740" y="618">derived media</text>
  <path class="edge" d="M320 520 H245"/><text class="edge-label" x="250" y="505">index + bytes</text>
  <path class="edge" d="M142 465 C100 365 250 220 320 160"/><text class="edge-label" x="150" y="335">frame / clip response</text>
  <path class="edge" d="M445 575 V620"/><text class="edge-label" x="458" y="607">authorize media</text>
</svg>